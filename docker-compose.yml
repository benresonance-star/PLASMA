services:
  postgres:
    image: postgres:16-alpine
    container_name: spds-postgres
    environment:
      POSTGRES_USER: spds
      POSTGRES_PASSWORD: spds
      POSTGRES_DB: spds
    ports:
      - "5432:5432"
    volumes:
      - spds_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spds -d spds"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: spds-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spdsminio
      MINIO_ROOT_PASSWORD: spdsminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - spds_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  geometry:
    build:
      context: .
      dockerfile: services/geometry-occt/Dockerfile
    container_name: spds-geometry
    environment:
      PORT: "7080"
      GEOMETRY_KERNEL: exact-adapter
      # Set GEOMETRY_KERNEL=occt-wasm for live occt-import-js STEP
    ports:
      - "7080:7080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gmsh:
    build:
      context: .
      dockerfile: services/meshing-adapter/Dockerfile.gmsh
    image: spds-gmsh
    container_name: spds-gmsh
    profiles: ["gmsh"]
    entrypoint: ["sleep", "infinity"]
    volumes:
      - spds_gmsh_work:/work

volumes:
  spds_pg_data:
  spds_minio_data:
  spds_gmsh_work:

services:
  postgres:
    image: postgres:16-alpine
    container_name: spds-postgres
    environment:
      POSTGRES_USER: spds
      POSTGRES_PASSWORD: spds
      POSTGRES_DB: spds
    ports:
      - "5432:5432"
    volumes:
      - spds_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spds -d spds"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: spds-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spdsminio
      MINIO_ROOT_PASSWORD: spdsminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - spds_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  spds_pg_data:
  spds_minio_data:

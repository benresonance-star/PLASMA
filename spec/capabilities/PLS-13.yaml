  "projection": {
    "id": "PLS-13",
    "phase": "Plasma",
    "name": "Typed Reasoning Operators + Contextual Lenses",
    "summary": "Define a small composable set of public, typed reasoning operations that transform evidence, claims, intent, questions, alternatives and evaluations into inspectable epistemic artefacts; allow declared contextual lenses to change which questions and criteria are applied to the same authoritative world object without duplicating that object or creating a second source of truth.",
    "spec": "partial",
    "implemented": "partial",
    "depends": [
      "PLS-01",
      "PLS-05",
      "PLS-08",
      "PLS-12"
    ],
    "gap": "Plasma defines epistemic states, proposals, evidence and deterministic validation more clearly than it defines the reusable reasoning moves connecting them. Without a typed operator layer, reasoning can collapse observation into interpretation, AI workflows can become bespoke prompt chains, perspective-specific questions can be confused with competing world truth, and explanations can degrade into post-hoc prose rather than inspectable provenance.",
    "next": "Validate the integrated RC-02 bedroom path under a normal browser origin with persisted proposal/commit, then measure physical desktop and iPhone interaction latency and currentness behaviour. After those integration gates, replay RC-01 terrain/driveway and RC-03 planning interpretation against the same retained reasoning-artefact schemas before adding operators.",
    "flow": "HUMAN / AI ACTOR → DECLARED QUESTION + OPTIONAL REASONING LENS → SELECT / COMPOSE TYPED REASONING OPERATORS → READ EPISTEMIC WORLD + INTENT + RULES + FIELDS / SOLVERS → PRODUCE PUBLIC REASONING ARTEFACTS → PROPOSAL / CLAIM / QUESTION / EVALUATION → PREVIEW → VALIDATE → HUMAN-AUTHORISED COMMIT → WORLD REVISION",
    "operators": [
      {
        "id": "observe",
        "input": "evidence",
        "output": "observation",
        "purpose": "Record what is present or measured without silently adding interpretation."
      },
      {
        "id": "interpret",
        "input": "observations + context",
        "output": "interpretation claim",
        "purpose": "Assign contextual meaning while preserving the observations it depends on."
      },
      {
        "id": "infer",
        "input": "claims + rules / models",
        "output": "derived claim",
        "purpose": "Derive a claim with explicit premises, method and confidence or validity."
      },
      {
        "id": "question",
        "input": "unknown / ambiguity / contradiction / decision need",
        "output": "question or information requirement",
        "purpose": "Make unresolved consequential uncertainty first-class rather than forcing premature closure."
      },
      {
        "id": "propose",
        "input": "intent + world + question",
        "output": "candidate ChangeSet / alternative",
        "purpose": "Create a bounded candidate without mutating authoritative state."
      },
      {
        "id": "challenge",
        "input": "claim / proposal",
        "output": "counter-case, failure condition or contested claim",
        "purpose": "Actively seek disconfirming evidence, violated assumptions and boundary cases."
      },
      {
        "id": "compare",
        "input": "two or more alternatives / revisions / claims",
        "output": "material differences",
        "purpose": "Expose decision-relevant differences under declared criteria rather than flattening them into one score."
      },
      {
        "id": "evaluate",
        "input": "claim / proposal + criteria",
        "output": "assessment",
        "purpose": "Apply deterministic checks, solver outputs, heuristics and/or judgement with provenance."
      },
      {
        "id": "perspective",
        "input": "world object + reasoning lens",
        "output": "lens-scoped questions / interpretations / criteria",
        "purpose": "Interrogate one authoritative object from a declared role, discipline, stakeholder or purpose without cloning truth."
      },
      {
        "id": "test",
        "input": "claim / hypothesis + method",
        "output": "evidence / result",
        "purpose": "Run a deterministic check, solver, experiment, retrieval or measurement whose result can support or challenge a claim."
      },
      {
        "id": "decide",
        "input": "alternatives + evidence + authority",
        "output": "decision / commitment",
        "purpose": "Record an explicit governed choice, its basis and authority without pretending uncertainty disappeared."
      },
      {
        "id": "revise",
        "input": "existing claim / belief + new evidence",
        "output": "superseding claim / belief",
        "purpose": "Change the accepted model while preserving the superseded state and causal lineage."
      }
    ],
    "reasoning_lens_contract": {
      "required": [
        "id",
        "purpose",
        "scope",
        "criteria_or_questions",
        "authority"
      ],
      "optional": [
        "role",
        "discipline",
        "stakeholder",
        "jurisdiction",
        "governing_version",
        "decision_stage",
        "fidelity",
        "risk_posture"
      ],
      "rule": "A lens changes the questions, criteria, weighting or interpretation context applied to an authoritative world object; it does not own alternate geometry or silently override accepted facts."
    },
    "reasoning_trace_contract": {
      "store": [
        "operator id/version",
        "declared question",
        "lens if any",
        "input claim/evidence/revision refs",
        "tool/rule/solver refs",
        "public output artefact",
        "uncertainty/status",
        "actor",
        "timestamp",
        "supersedes/causes refs where applicable"
      ],
      "do_not_require": [
        "private model chain-of-thought",
        "free-form hidden scratchpad",
        "post-hoc causal prose presented as provenance"
      ],
      "principle": "Plasma stores inspectable reasoning products and typed transitions sufficient for audit, explanation and replay; it does not depend on exposing or preserving a model's private internal reasoning process."
    },
    "reasoning_validation_harness": {
      "purpose": "Test whether the proposed reasoning operators are genuinely reusable architecture rather than renamed domain workflow steps or AI-prompt conventions.",
      "fixture_rule": "Fixtures are synthetic and versioned. Their numerical values are test data, not regulatory or professional advice. Each replay pins world revision, claim/evidence ids, rule/tool versions, lens version and expected trace assertions.",
      "public_artifact_minimum": [
        "artifact id + type",
        "operator id/version",
        "declared question or intent ref",
        "input evidence/claim/world-revision refs",
        "reasoning lens ref when used",
        "rule/tool/solver/method refs when used",
        "output claim/question/proposal/evaluation/decision ref",
        "status + uncertainty/validity where applicable",
        "actor + authority",
        "causes/supersedes refs",
        "timestamp + replay correlation id"
      ],
      "anti_cheating_invariants": [
        "Narrative prose alone never satisfies an operator assertion.",
        "No inferred or interpreted value may overwrite its source observation or masquerade as measured fact.",
        "A lens may alter questions, criteria or weighting but may not silently alter authoritative geometry, facts, rules or authority.",
        "A deterministic check must cite the exact inputs and rule/tool/solver version that produced the result.",
        "A decision must identify the actor/authority that committed it; AI recommendation alone is not commitment unless explicitly authorized by policy.",
        "A revised belief supersedes rather than deletes the prior belief and preserves the evidence that caused the change.",
        "The harness must be able to replay a trace without access to private model chain-of-thought."
      ],
      "operator_retention_gate": {
        "default_rule": "Retain an operator as a Plasma primitive only when the same input/output semantics recur in at least two materially different validation cases without domain-specific meaning leaking into the operator contract.",
        "exception_rule": "A one-case operator may remain only when it protects a demonstrated epistemic or governance boundary that cannot be safely represented by composition of retained operators; the exception requires an ADR and red-team case.",
        "merge_rule": "If two operators repeatedly produce the same typed transition and differ only by prompt wording, merge them.",
        "split_rule": "If one operator requires incompatible input/output semantics across cases, split the domain-specific behaviour into a capability/lens before splitting the primitive.",
        "failure_rule": "If the three cases require bespoke orchestration with little reusable operator semantics, remove PLS-13 as a primitive layer and retain only reasoning traces over ordinary typed events."
      },
      "cross_case_assertions": [
        "Observation remains distinct from interpretation in terrain and planning cases.",
        "Proposal remains distinct from committed world state in terrain and bedroom cases.",
        "Test/evaluate cite deterministic machinery in terrain and bedroom cases and source/applicability machinery in planning.",
        "Question can remain unresolved and drive value-of-information rather than being forced into a conclusion.",
        "Decide records authority and basis in all three cases.",
        "Revise preserves supersession lineage when new survey evidence, a changed design decision or a clarified planning interpretation arrives.",
        "Perspective/lens changes interrogation context without cloning the underlying object or rule set."
      ],
      "minimum_metrics": [
        "trace completeness: required public-artifact fields populated",
        "provenance resolution: every material claim resolves to evidence/world/tool/rule refs",
        "semantic stability: same operator schema validates across cases",
        "unresolved-state honesty: consequential unknowns remain explicit",
        "decision authority correctness",
        "replay determinism for deterministic substeps",
        "supersession integrity",
        "operator count after consolidation"
      ]
    },
    "validation_cases": [
      {
        "id": "RC-01-terrain-driveway",
        "name": "Uncertain crossover RL → robust or fragile driveway decision",
        "objective": "Prove that Plasma can keep measured evidence, correspondence interpretation, bounded inference, deterministic grade testing, robustness classification, value-of-information and design commitment separate while still producing a concise actionable result.",
        "fixture": {
          "type": "synthetic-terrain-driveway-v1",
          "world": "24 m × 36 m site with source terrain, proposed pad and driveway alignment",
          "evidence": [
            {
              "id": "ev-survey-rl-a",
              "kind": "survey annotation",
              "value": "31.42 m",
              "uncertainty": "±0.05 m",
              "status": "observed",
              "note": "test fixture only"
            },
            {
              "id": "ev-crossover-symbol-a",
              "kind": "survey graphic",
              "status": "observed",
              "note": "symbol correspondence is intentionally ambiguous"
            }
          ],
          "intent": "Reach proposed pad while minimizing earthworks and satisfying the pinned synthetic driveway-grade rule.",
          "synthetic_rule": "DRV-GRADE-FIXTURE@1: maximum test grade 16%; fixture only, not a jurisdictional claim."
        },
        "lenses": [
          "civil/site design",
          "access/vehicle movement",
          "constructability/value-of-information"
        ],
        "required_operator_trace": [
          {
            "op": "observe",
            "assert": "31.42 m and ±0.05 m are stored as evidence-bearing observation, not accepted crossover design level."
          },
          {
            "op": "interpret",
            "assert": "Create a separate correspondence claim that the annotation refers to the crossover control point; preserve ambiguity and source refs."
          },
          {
            "op": "question",
            "assert": "Emit a material question if correspondence or RL uncertainty can change grade classification."
          },
          {
            "op": "infer",
            "assert": "Create a bounded crossover design-level claim from the observation + correspondence interpretation; do not mutate the observation."
          },
          {
            "op": "propose",
            "assert": "Generate at least one bounded pad/driveway candidate ChangeSet without committing it."
          },
          {
            "op": "test",
            "assert": "Run pinned grade calculation across the relevant uncertainty interval and cite geometry/world revision + DRV-GRADE-FIXTURE@1."
          },
          {
            "op": "evaluate",
            "assert": "Classify robust-pass / fragile-pass / indeterminate / fail from the interval result, not a single nominal number."
          },
          {
            "op": "challenge",
            "assert": "Evaluate the boundary case most likely to reverse the classification and expose any hidden assumption."
          },
          {
            "op": "question",
            "assert": "Rank the next survey fact when it materially reduces consequential uncertainty."
          },
          {
            "op": "compare",
            "assert": "Compare freeze-now versus obtain-survey-first and any feasible geometric alternative on material criteria."
          },
          {
            "op": "decide",
            "assert": "Record whether geometry may be frozen, with human/policy authority and unresolved assumptions."
          },
          {
            "op": "revise",
            "assert": "When a replacement surveyed RL is injected, supersede the inferred claim and re-evaluate only the affected dependency region."
          }
        ],
        "perturbations": [
          "Shift the observed RL within its uncertainty band without changing the source artifact id.",
          "Resolve the correspondence ambiguity to a different nearby survey symbol.",
          "Inject a new authoritative surveyed crossover RL that contradicts the inferred value.",
          "Change pad level enough to cross the synthetic grade limit.",
          "Mark the grade result stale by changing the driveway geometry after calculation."
        ],
        "acceptance_tests": [
          "The trace can identify exactly which evidence, interpretation and uncertainty make the result robust, fragile, indeterminate or failed.",
          "A nominal compliant grade with an uncertainty interval crossing the limit cannot be reported as robust-pass.",
          "Obtaining a new authoritative RL revises downstream claims without rewriting historical observations.",
          "The value-of-information question points to a targeted missing fact rather than requesting a generic full resurvey.",
          "Stale deterministic results cannot support a final decision."
        ],
        "forbidden": [
          "Treat 31.42 m as unquestioned accepted truth.",
          "Return only a prose explanation of grade compliance.",
          "Freeze geometry because the nominal value passes while the uncertainty interval crosses the limit.",
          "Recompute unrelated world regions merely because one RL changed."
        ],
        "pass_evidence": "Replay bundle containing fixture, trace artifacts, pinned rule/tool versions, expected robustness classifications, dependency invalidation scope and supersession check."
      },
      {
        "id": "RC-02-bedroom-move",

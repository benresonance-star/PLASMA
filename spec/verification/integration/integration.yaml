    "architectureStates": [
      {
        "id": "defined",
        "label": "Defined",
        "description": "The typed Atlas relationship is defined."
      },
      {
        "id": "partial",
        "label": "Partial",
        "description": "The relationship is known but semantics/contracts remain incomplete."
      },
      {
        "id": "planned",

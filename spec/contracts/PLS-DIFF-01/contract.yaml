  "projection": {
    "id": "differential-contract",
    "name": "PLS-DIFF-01 · DifferentialContract v0.1",
    "from": "authority",
    "to": "differential",
    "input": "Authoritative source state + stable typed inputs/outputs + Δinputs for JVP or output seed for VJP",
    "output": "Non-authoritative local prediction/sensitivity + validity/trust + uncertainty + discontinuity status + exact-fallback requirement + provenance",
    "semantics": "Optional solver contract. JVP predicts local output deltas; VJP exposes local input leverage. Every result is anchored to a linearisation state and solver version, remains derived/disposable, and carries validity/trust boundaries.",
    "failure": "Never cross a known discontinuity, validity boundary, trust limit, high-uncertainty condition, regulatory/final-commit gate or topology change as if the approximation were exact. Invoke the declared exact fallback where required.",
    "explanation": "Deferred architecture only. Differential prediction is not exact output; sensitivity is not causality; optimisation is not decision authority. No automatic-differentiation infrastructure or solver integration has started.",
    "status": "DEFERRED",
    "architectureStatus": "ACCEPTED",
    "implementationStatus": "NOT_STARTED",
    "runtimeStatus": "DISABLED",
    "authority": "NON_AUTHORITATIVE_DERIVED",
    "authorityRules": [
      "Differential outputs never directly mutate authoritative state.",
      "Differential prediction is not an exact solver result.",
      "Sensitivity is not causality.",
      "Optimisation output is not decision authority.",
      "Every activated DifferentialContract identifies an exact, validated or reference fallback."
    ],
    "relationships": [
      {
        "target": "Claim",
        "rule": "JVP predictions normally map to inferred; local sensitivities may map to calculated only when explicitly scoped to the model, source state, solver version and validity region. Exact results may supersede or contradict without deleting provenance.",
        "status": "specified"
      },
      {
        "target": "Evidence",
        "rule": "Retain relevant input, solver-definition, calibration, validation, benchmark, regulatory, measurement and derivation references. Numerical precision does not raise evidence quality.",
        "status": "specified"
      },
      {
        "target": "DecisionContract",
        "rule": "May consume leverage, marginal effects, recovery directions and exact-solver prioritisation; DecisionContract retains decision authority, confidence policy, escalation, evidence/validation requirements and commit conditions.",
        "status": "specified; DecisionContract is referenced but not yet a dedicated Atlas contract node"
      }
    ],

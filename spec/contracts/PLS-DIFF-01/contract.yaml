    "id": "PLS-21",
    "phase": "Plasma",
    "name": "DifferentialContract v0.1",
    "contract_id": "PLS-DIFF-01",
    "contract_version": "0.1.0",
    "status": "DEFERRED",
    "architecture_status": "ACCEPTED",
    "implementation_status": "NOT_STARTED",
    "runtime_status": "DISABLED",
    "authority": "NON_AUTHORITATIVE_DERIVED",
    "owner_domain": "Solver / Derived Compute Layer",
    "purpose": "Optional interface through which a Plasma solver may expose local sensitivity, predicted response, inverse sensitivity, uncertainty, validity and trust information around an authoritative solver state.",
    "kernel_change": false,
    "capabilities": {
      "jvp": "optional; at least one of JVP/VJP required if activated",
      "vjp": "optional; at least one of JVP/VJP required if activated",
      "explicit_jacobian": "optional",
      "second_order": "optional",
      "uncertainty_propagation": "optional"
    },
    "jvp": {
      "definition": "JVP(Δx)=JΔx",
      "question": "Given a local input perturbation, what local output change is predicted?",
      "uses": [
        "change propagation",
        "incremental prediction",
        "interaction preview",
        "selective recomputation",
        "local effect estimation"
      ]
    },
    "vjp": {
      "definition": "VJP(v)=v^T J",
      "question": "Given an output objective or constraint pressure, which inputs have the strongest local influence?",
      "uses": [
        "inverse design",
        "local optimisation guidance",
        "constraint-recovery guidance",
        "design leverage analysis",
        "sensitivity ranking"
      ],
      "rule": "Influence information only; never an instruction or approval to edit."
    },
    "validity": {
      "requires_linearization_state": true,
      "methods": [
        "per-variable limits",
        "normalised parameter-space distance",
        "solver predicates",
        "empirical calibration",
        "constraint state",
        "hybrid"
      ],
      "rule": "Outside the validity region a result SHALL NOT be used as a valid quantitative prediction."
    },
    "trust": {
      "levels": [
        "HIGH",
        "MEDIUM",
        "LOW",
        "OUTSIDE"
      ],
      "rule": "Known discontinuities override trust-radius classification."
    },
    "discontinuities": {
      "classes": [
        "topology",
        "visibility",
        "contact",
        "collision",
        "constraint activation",
        "constraint deactivation",
        "classification",
        "regulatory threshold",
        "solver regime",
        "piecewise boundary",
        "discrete choice",
        "unknown"
      ],
      "behaviours": [
        "INVALIDATE",
        "REDUCE_TRUST",
        "SWITCH_BRANCH",
        "REQUIRE_EXACT"
      ]
    },
    "uncertainty": {
      "rule": "Uncertainty remains separate from sensitivity.",
      "sources": [
        "input",
        "measurement",
        "model",
        "numerical",
        "parameter",
        "approximation",
        "surrogate"
      ]
    },
    "evidence_refs": {
      "roles": [
        "input source",
        "solver definition",
        "model assumptions",
        "calibration",
        "validation",
        "benchmark",
        "regulatory source",
        "measurement source",
        "derivation method"
      ],
      "rule": "Numerical precision SHALL NOT be treated as evidence quality."
    },
    "solver_versioning": {
      "required": [
        "solverId",
        "solverVersion",
        "contractVersion",
        "sourceStateId",
        "solverRunId"
      ],
      "recommended": [
        "implementationVersion",
        "schemaVersion",
        "modelVersion",
        "commitSha",
        "buildId",
        "runtime backend",
        "numeric precision"
      ],
      "rule": "Cached differential information becomes stale when a solver/model change may alter derivatives."
    },
    "exact_fallback": {
      "mandatory": true,
      "triggers": [
        "outside validity region",
        "outside trust radius",
        "discontinuity crossed",
        "topology change",
        "high uncertainty",
        "constraint near threshold",
        "final commit",
        "regulatory decision",
        "manual exact request"
      ]
    },
    "authority_rules": [
      "Differential outputs never directly mutate authoritative state.",
      "Differential prediction is not an exact solver result.",
      "Sensitivity is not causality.",
      "Optimisation output is not decision authority.",
      "Every activated DifferentialContract identifies an exact, validated or reference fallback."
    ],
    "relationships": {
      "Claim": {
        "jvp_prediction": "normally inferred",
        "local_sensitivity": "may be calculated when explicitly scoped to model, source state, solver version and validity region",
        "supersession": "exact results may supersede or contradict without deleting differential provenance"
      },
      "Evidence": {
        "rule": "Retain relevant input, solver, calibration, validation, benchmark, regulatory, measurement and derivation references.",
        "quality": "Numerical precision does not raise evidence quality."
      },
      "DecisionContract": {
        "may_consume": [
          "high-leverage variables",
          "local consequences",
          "candidate recovery directions",
          "marginal effects",
          "exact-solver prioritisation",
          "optimisation proposals"
        ],
        "retains": [
          "decision authority",
          "confidence policy",
          "escalation",
          "required evidence",
          "required validation",
          "commit conditions"
        ]
      }
    },

        "summary": "Site + unit mix + cores + structure + services + envelope → stacked building system → whole-building validation → documentation and feasibility.",
        "purpose": "Prove that Plasma can coordinate a multi-storey apartment building as interacting spatial and technical systems across floors, rather than as repeated plans with disconnected consultant models.",
        "whyThisSlice": "Apartments introduce vertical coupling and shared systems at a scale townhouses do not. Unit layouts depend on structural grids, cores, egress, fire compartments, risers, façade, daylight, acoustics, services distribution, parking, plant, circulation, buildability and economics. A small change to one system can propagate through many storeys and disciplines.",

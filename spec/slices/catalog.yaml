      "projection": {
        "id": "townhouse-system",
        "name": "Townhouse system → compliant site ensemble",
        "domain": "Medium-density housing",
        "summary": "Parcel + planning + dwelling system → site layout → access / parking / landscape → coordinated townhouse ensemble → feasibility evidence.",
        "purpose": "Prove that Plasma can generate and continuously coordinate a real medium-density townhouse project from site evidence and planning constraints through dwelling layout, shared access, private open space, parking, landscape, servicing, documentation and feasibility.",
        "whyThisSlice": "Townhouses are a strong building-scale proving ground because they combine repeated dwelling systems with highly site-specific planning geometry. A viable result depends on interactions between setbacks, overlooking, solar access, vehicle movement, private open space, deep planting, levels, drainage, dwelling amenity, construction systems and economics. Optimising any one of these in isolation is not enough.",
        "flow": [
          "site + planning evidence",
          "development intent + dwelling yield target",
          "site capacity / constraint field",
          "townhouse typology + dwelling systems",
          "massing + orientation + private open space",
          "vehicle / pedestrian access + parking",
          "landscape + drainage + services",
          "amenity / planning / geometry validation",
          "cost + yield + feasibility evaluation",
          "candidate scheme commit + derived documentation"
        ],
        "proves": [
          "site-specific constraints and reusable dwelling systems can interact without collapsing into one monolithic generator",
          "a repeated townhouse type can vary by orientation, frontage, level and boundary condition while retaining semantic lineage",
          "planning, amenity, access, landscape, drainage and economics can evaluate the same candidate world rather than separate models",
          "high-level operations such as change yield, widen driveway or increase private open space can propagate through dependent geometry and analysis",
          "multiple viable alternatives can be retained as comparable branches with explicit evidence rather than a single opaque optimum"
        ],
        "stressPoints": [
          "irregular parcels, slope and constrained frontage",
          "conflicts between dwelling yield, private open space, deep planting and vehicle access",
          "overlooking, daylight, shadow and boundary relationships between closely spaced dwellings",
          "shared versus private infrastructure and ownership boundaries",
          "late planning or consultant changes invalidating many dependent assumptions at once",
          "keeping feasibility fast while exact geometry and compliance checks progressively refine"
        ],
        "successCriteria": [
          "a site can move from imported context to several coherent townhouse options without manually rebuilding each discipline model",
          "changing dwelling count or site circulation produces traceable updates to affected setbacks, access, landscape, drainage, quantities and feasibility",
          "each dwelling retains identity and can vary locally without breaking the repeated system",
          "failed planning or geometry conditions identify the causal entities and constraints rather than only returning a generic scheme failure",
          "a selected scheme can derive coordinated plans, sections, schedules, quantities and consultant-ready world slices from the same authoritative state",
          "alternative schemes can be compared on yield, amenity, compliance risk and cost with their assumptions and evidence visible"
        ],
        "keySystems": [
          "Site Language",
          "World + Authority Plane",
          "Geometry Resolver",
          "Constraint Runtime",
          "Assembly Language",
          "Analysis Language",
          "Representations",
          "External Systems"
        ],

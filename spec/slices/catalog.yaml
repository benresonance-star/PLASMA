      "projection": {
        "id": "wall-assembly",
        "name": "Parametric wall assembly",
        "domain": "Building systems",
        "summary": "PLS-19 / PLS-WALL-01@0.1.0: editable path, height, base elevation, reference lines, layers, persistent junctions and hosted openings with bounded regeneration.",
        "purpose": "Prove the v0.4.27 parametric wall contract across design intent, typed changes, exact geometry, space boundaries, coherent quantities/cost/drawings and reopen recovery. Specified; implementation unproven.",
        "whyThisSlice": "Walls expose the general composition problem found throughout buildings: systems contain subsystems and components, interfaces matter, repetition is rule-driven, and apparently simple edits create junction, opening, material and fabrication consequences.",
        "flow": [
          "draw straight/polyline path",
          "pin wall system and layer parameters",
          "declare reference line / junction / hosted placement",
          "preview typed edit and room consequences",
          "validate candidate and exact geometry",
          "atomic commit",
          "bounded dependent regeneration",
          "coherent quantities / cost / drawings",
          "branch, undo, save and reopen"
        ],
        "proves": [
          "nested composition does not require a special verb for every building product",
          "interfaces and connectors can be first-class semantic entities",
          "assembly rules can generate components while preserving identity and provenance",
          "high-level edits can propagate into low-level fabrication geometry",
          "derived drawings and quantities remain projections of the same authoritative system"
        ],
        "stressPoints": [
          "One active writer per driven parameter; total thickness derived from layers",
          "Left/right orientation and reference-line intent after path reversal",
          "L/T/cross junction policy and layer termination",
          "Opening placement, split/delete host disposition and topology ambiguity",
          "Clear dimensions versus reference dimensions; corridor conflict propagation",
          "Stale asynchronous results and coherent publication",
          "Pinned system migration, branch isolation and normal-origin reopen",
          "Deferred: curved/freeform walls, tapered profiles and general junction solving"
        ],
        "successCriteria": [
          "WALL-AT-01 · Create and edit: Create a two-layer straight wall, then a polyline. Change height, base elevation, a named layer thickness and offset. Verify generated dimensions and reference-line placement within the declared tolerance; total thickness remains derived and physical face intent survives path reversal.",
          "WALL-AT-02 · Junction policies: Exercise L, T and crossing joins under supported butt/miter/priority policies with different layer configurations. Move an endpoint and regenerate repeatedly. Verify relation identity, declared layer termination and explicit unresolved status for unsupported/micro-gap/ambiguous cases.",
          "WALL-AT-03 · Hosted placement: Use both centred and fixed-jamb windows, resize and move the host, then change its construction. Verify opening/host identity and placement intent. Split/delete the host and require explicit disposition. Reject conflicting active placement writers.",
          "WALL-AT-04 · Rooms and conflicts: Move the bedroom/corridor boundary under take-space and preserve-neighbour strategies. Show the requested conflicted preview and affected rooms without silently changing strategy. Test the live fixture separately from synthetic data; do not substitute historic +315 mm synthetic values for the documented +150 mm live hard limit.",
          "WALL-AT-05 · Atomicity and stale work: Reject a stale-base wall edit; fail an exact geometry/junction operation; ensure accepted head and unaffected entities remain intact. Late geometry/quantity results cannot replace current outputs or enable publication.",
          "WALL-AT-06 · Quantity and document coherence: Compare layer volumes and opening deductions against independently calculated fixture expectations, including junction allocation. Update plan/section and cost after a parameter edit; all issued outputs refer to an explicitly coherent revision set.",
          "WALL-AT-07 · Branch, undo and reopen: Edit two branches independently, adopt one, undo, close and reopen in a normal storage origin. Recover from interrupted/corrupt persistence using the existing governed recovery path. Reconstruct system pins, parameters, relations, outputs and history; a synthetic storage harness is supporting evidence only.",
          "WALL-AT-08 · System migration and modalities: Update a library system without modifying the pinned project. Preview and evaluate migration on a branch. Prove equivalent operations from numeric editing, pointer input and a reviewed language proposal, with usable direct editing when AI is unavailable."
        ],
        "keySystems": [
          "World + Authority Plane",
          "Geometry Resolver",
          "Constraint Runtime",
          "Assembly Language",
          "Representations"
        ],
        "declaredState": "specified; implementation unproven",
        "evidenceState": "not-linked",
        "checks": {
          "spec": "declared",
          "contracts": "declared",
          "code": "not-linked",
          "unitTests": "not-linked",
          "e2e": "not-linked",
          "benchmark": "not-linked"
        },
        "explanation": "The v0.4.27 wall contract makes parameters and regeneration explicit without adding a kernel primitive. Construction, junction and host rules persist above evaluated geometry. The existing wall/opening scenario is retained; eight new acceptance gates have no executable proof yet. Straight/polyline V1 precedes curved/general wall systems.",

      "projection": {
        "id": "terrain-site",
        "name": "Terrain → site foundation",
        "domain": "Site / context",
        "summary": "From survey and site intent to authoritative terrain, constraints, evidence and derived context representations.",
        "purpose": "Prove that Plasma can ingest imperfect real-world site information, create an authoritative semantic site model, support fast human editing, and propagate site changes through geometry, constraints, hydrology, evidence and representations.",
        "whyThisSlice": "Site work touches almost every foundational concern at once: external evidence, spatial identity, editable geometry, planning constraints, fields, derived analyses and change propagation. If this slice is weak, downstream feasibility is built on unreliable context.",
        "flow": [
          "survey / GIS / user evidence",
          "site entities + semantic references",
          "terrain and grading operation",
          "candidate geometry",
          "constraint + hydrology validation",
          "atomic commit",
          "dependency invalidation",
          "updated views / reports"
        ],
        "proves": [
          "external evidence can become traceable world state without becoming unquestioned truth",
          "terrain edits remain semantic operations rather than raw mesh manipulation",
          "exact, approximate and field representations can coexist",
          "planning, drainage and geometry checks can evaluate the same candidate world",
          "site changes invalidate only causally dependent results"
        ],
        "stressPoints": [
          "noisy or contradictory source data",
          "large terrain meshes and contours",
          "stable references after grading or topology change",
          "interactive preview versus exact committed geometry",
          "local edits with global drainage consequences"
        ],
        "successCriteria": [
          "a site can be imported, corrected and graded without bypassing the transaction boundary",
          "changing a pad, driveway or contour updates affected drainage and planning checks",
          "all derived site representations expose freshness and provenance",
          "annotations and references survive routine terrain regeneration",
          "the workflow remains responsive on representative medium-density sites"
        ],
        "keySystems": [
          "Interaction Plane",
          "World + Authority Plane",
          "Geometry Resolver",
          "Constraint Runtime",
          "Representations",
          "External Systems"
        ],
        "declaredState": "active implementation",
        "evidenceState": "not-linked",
        "checks": {
          "spec": "declared",
          "contracts": "declared",
          "code": "declared",
          "unitTests": "not-linked",
          "e2e": "not-linked",
          "benchmark": "not-linked"
        },
        "explanation": "This is the primary site/context proving slice. It is deliberately broader than a terrain editor: the important test is whether real-world evidence can be turned into dependable, editable, authoritative site state and then safely drive downstream design decisions.",
        "integrationEvidence": [
          "ev-slice-terrain-site"
        ]
      }

        "explanation": "The townhouse slice is Plasma's primary medium-density housing test. It is not merely a floor-plan generator: it tests whether site, planning, dwelling systems, access, landscape, infrastructure, amenity and economics can remain causally connected while the design changes. It should eventually support rapid feasibility through coordinated documentation without hiding the evidence behind each decision.",

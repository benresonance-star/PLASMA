name: Fusion 01 Source Reconciliation

on:
  pull_request:
    paths:
      - 'packages/import-core/**'
      - 'apps/api/src/fusion-preview*'
      - 'apps/api/src/server.ts'
      - 'apps/api/package.json'
      - 'apps/designer-web/src/ui/FusionStudio.tsx'
      - 'apps/designer-web/src/ui/App.tsx'
      - 'pnpm-lock.yaml'
      - '.github/workflows/fusion-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Build API dependency graph
        run: pnpm --filter '@spds/api^...' build
      - name: Fusion importer tests
        run: pnpm --filter @spds/import-core exec vitest run src/fusion.test.ts
      - name: Fusion HTTP integration tests
        run: pnpm --filter @spds/api exec vitest run src/fusion-preview.test.ts

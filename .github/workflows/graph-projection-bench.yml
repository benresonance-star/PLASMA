# G1b — PR SD12 scale benches (1k / 10k). Fails on budget breach.
name: graph-projection-bench

on:
  pull_request:
    paths:
      - 'packages/graph-projection/**'
      - '.github/workflows/graph-projection-bench.yml'
  push:
    branches: [main]
    paths:
      - 'packages/graph-projection/**'
      - '.github/workflows/graph-projection-bench.yml'
  workflow_dispatch:

jobs:
  sd12-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --use-system-ca
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install graph-projection workspace
        run: pnpm install --frozen-lockfile --filter @spds/graph-projection...

      - name: Build graph-projection dependencies
        run: pnpm --filter @spds/graph-projection... -r build

      - name: SD12 PR benches (1k / 10k)
        run: pnpm --filter @spds/graph-projection test:scale:pr

name: TH-01 basin drain browser verification
on:
  push:
    branches: [feat/basin-gravity-solver-v04]
    paths:
      - 'packages/basin-drain-core/**'
      - 'apps/basin-drain-lab/**'
      - '.github/workflows/basin-drain-browser.yml'
jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spds/basin-drain-lab... build
      - name: Real mobile browser + GPU and hydraulic behaviour
        run: |
          set -euo pipefail
          pnpm --filter @spds/basin-drain-lab exec vite preview --host 127.0.0.1 --port 4181 --strictPort > /tmp/basin-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4181/ -o /dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/basin-cdp-chrome about:blank > /tmp/basin-chrome.log 2>&1 &
          node apps/basin-drain-lab/scripts/mobile-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basin-drain-browser-evidence
          path: |
            /tmp/basin-mobile-3d.png
            /tmp/basin-3d-frame.png
            /tmp/basin-mobile-section.png
          retention-days: 7

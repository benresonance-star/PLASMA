name: TH-01 basin drain hydraulic benchmark
on:
  push:
    branches: [feat/basin-gravity-solver-v04]
  pull_request:
    paths:
      - 'packages/basin-drain-core/**'
      - 'apps/basin-drain-lab/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/basin-drain.yml'
jobs:
  basin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: 
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spds/basin-drain-core lint
      - run: pnpm --filter @spds/basin-drain-core typecheck
      - run: pnpm --filter @spds/basin-drain-core build
      - run: pnpm --filter @spds/basin-drain-core test
      - run: pnpm --filter @spds/basin-drain-lab lint --if-present
      - run: pnpm --filter @spds/basin-drain-lab... build --if-present

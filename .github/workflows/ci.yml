name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --use-system-ca
      DATABASE_URL: postgres://spds:spds@127.0.0.1:5432/spds
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spds
          POSTGRES_PASSWORD: spds
          POSTGRES_DB: spds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spds -d spds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Licence check
        run: pnpm licence:check

      - name: Boundary check
        run: pnpm boundary:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Timing-budget tests need to avoid contention with other package suites.
        run: pnpm exec turbo run test --concurrency=1

      - name: Build
        run: pnpm build
